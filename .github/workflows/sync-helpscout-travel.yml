name: Dive Travel daily availability snapshot
on:
  schedule:
    - cron: "0 8 * * *"
      timezone: "Australia/Sydney"
    - cron: "37 8 * * *"
      timezone: "Australia/Sydney"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-helpscout-travel.yml'
      - 'data/helpscout-travel-target.json'
      - 'src/helpscout-travel*.mjs'
      - 'scripts/*helpscout-travel.mjs'
  pull_request:
    paths:
      - '.github/workflows/sync-helpscout-travel.yml'
      - 'data/helpscout-travel-target.json'
      - 'src/helpscout-travel*.mjs'
      - 'scripts/*helpscout-travel.mjs'
      - 'tests/helpscout-travel.test.mjs'
permissions:
  contents: read
concurrency:
  group: helpscout-travel-${{ github.event_name == 'pull_request' && github.run_id || 'publish' }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Refresh and verify the trip snapshot
        run: node scripts/sync-helpscout-travel.mjs
        env:
          DRY_RUN: 'false'
          HELP_SCOUT_DOCS_API_KEY: ${{ secrets.HELP_SCOUT_DOCS_API_KEY }}
      - name: Save validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: helpscout-travel-${{ github.run_number }}-${{ github.run_attempt }}
          path: diagnostics/helpscout-travel-*
          if-no-files-found: ignore
          retention-days: 14
      - name: Record the successful refresh
        run: |
          git config user.name "abyss-future-dive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          record=$(mktemp)
          trap 'rm -f "$record"' EXIT
          cp data/helpscout-travel-sync-status.json "$record"
          # Reconcile with current main before creating the status-only commit.
          # This avoids replaying an old run's status diff over a newer record.
          git restore --source=HEAD -- data/helpscout-travel-sync-status.json
          git fetch origin main
          git merge --ff-only origin/main
          node --input-type=module - "$record" <<'NODE'
          import fs from 'node:fs';
          const path='data/helpscout-travel-sync-status.json';
          const incoming=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const current=JSON.parse(fs.readFileSync(path,'utf8'));
          if(!Number.isFinite(Date.parse(incoming.checkedAt)) || !['updated','unchanged'].includes(incoming.publication?.status)) throw Error('Refusing an unverified status record');
          if(Date.parse(incoming.checkedAt)>=Date.parse(current.checkedAt)) fs.copyFileSync(process.argv[2],path);
          else console.log('A newer verified Travel status already exists; preserved');
          NODE
          git add -- data/helpscout-travel-sync-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: record verified travel snapshot refresh"
          bash scripts/push-publication-records.sh
