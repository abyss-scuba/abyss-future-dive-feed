name: Inspect fixed first-dive draft without edits
on:
  push:
    branches: ['qa/new-diver-suggested-questions-27449']
    paths: ['.github/workflows/new-diver-qa-draft-read.yml']
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v6
        with: {node-version: '22'}
      - name: Read only the fixed first-dive published article and draft
        env:
          HELP_SCOUT_DOCS_API_KEY: ${{ secrets.HELP_SCOUT_DOCS_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import {randomBytes,createCipheriv,publicEncrypt,constants,createHash} from 'node:crypto';
          const pub=`-----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAwEj09DmS99RAXw0HM82V
          TR1oTu3mjuDoYUmVYDHpGjynFEg6Pet8/INxrFjI7bdJVBM0dMmKsZ0aT+GTA2BE
          He64tfnBMaMSK2tGcNLhjwCu7EMZ1oNa+Azps2ViQoiD4WJZZxxyfXeaep1fDTKW
          MRJIcY0GS11oGQkSqVpQgd4y+xiQu7PEkYqlfUoirJDV/7XMmb7JZaA2F2dp99t/
          TcYrXlYGJZlyYwnqUAW6QvIX8jmro1hTFYrjo0+7zH3ZqxJNT3LXaAvHDOT7VXwj
          36xp7NjUBwcbhBb60cRKXGNi3K0vDazNehDjr/JX9k6+lQ1oovtmR2bhwo1hBb/g
          KkDCcBCuxGUhlWyURNI1wjYfhcBnuWReOOyYij87XLi5LHRtoOafpLnIcJJyIUSr
          UejR1H+mkPGi7kMMcFAmdsXIjBufDt4hD3Syxg8aGBLMS6t8b38cH4rvJIoYQQYp
          Hfd97bp8mBXSWGvy4GpkLV2q+GqBmQtvIhJ2/euCKWqlAgMBAAE=
          -----END PUBLIC KEY-----`;
          const id='6abf733d3be702ed269e3fa6',hash=x=>createHash('sha256').update(x).digest('hex');
          try{
            const articles=[];
            for(const draft of [false,true]){
              const r=await fetch('https://docsapi.helpscout.net/v1/articles/'+id+'?draft='+draft,{redirect:'error',signal:AbortSignal.timeout(25000),headers:{Authorization:'Basic '+Buffer.from(process.env.HELP_SCOUT_DOCS_API_KEY+':X').toString('base64'),Accept:'application/json'}});
              if(!r.ok)throw new Error('Read status '+r.status);
              const a=(await r.json()).article;if(a.id!==id||a.collectionId!=='6abf61e6c3e570044c2891ed'||typeof a.text!=='string')throw new Error('Identity mismatch');
              articles.push({requestedDraft:draft,article:a});
            }
            const key=randomBytes(32),iv=randomBytes(12),c=createCipheriv('aes-256-gcm',key,iv),data=Buffer.from(JSON.stringify({checkedAt:new Date().toISOString(),articles}));
            const ciphertext=Buffer.concat([c.update(data),c.final()]);
            await fs.mkdir('qa-draft',{recursive:true});
            await fs.writeFile('qa-draft/draft.encrypted.json',JSON.stringify({wrappedKey:publicEncrypt({key:pub,padding:constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},key).toString('base64'),iv:iv.toString('base64'),tag:c.getAuthTag().toString('base64'),ciphertext:ciphertext.toString('base64')}));
            const status={id,readOnly:true,publishedHash:hash(articles[0].article.text),draftHash:hash(articles[1].article.text),sameText:articles[0].article.text===articles[1].article.text,hasDraft:articles[0].article.hasDraft};
            await fs.writeFile('qa-draft/status.json',JSON.stringify(status,null,2));console.log(JSON.stringify(status));
          }catch(e){console.error('Fixed draft read stopped: '+e.message);process.exitCode=1}
          NODE
      - uses: actions/upload-artifact@v7
        with:
          name: new-diver-27449-encrypted-draft-read
          path: qa-draft/
          retention-days: 3
          if-no-files-found: error
