name: Sydney Dive Calendar Help Scout article

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Update the live Help Scout article (leave unchecked for a dry run)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: helpscout-sydney-dive-calendar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DRY_RUN: ${{ inputs.publish && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Read Beacon widgets and check or update the Help Scout article
        run: npm run sync:helpscout
        env:
          HELP_SCOUT_DOCS_API_KEY: ${{ secrets.HELP_SCOUT_DOCS_API_KEY }}
          HELP_SCOUT_ARTICLE_ID: ${{ secrets.HELP_SCOUT_ARTICLE_ID }}
      - name: Save candidate and validation summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: helpscout-calendar-${{ github.run_number }}
          path: diagnostics/helpscout-calendar-*
          if-no-files-found: ignore
          retention-days: 14
