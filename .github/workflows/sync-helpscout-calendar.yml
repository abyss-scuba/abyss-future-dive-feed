name: Sydney Dive Calendar Help Scout article

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Update the live Help Scout article (leave unchecked for a dry run)"
        type: boolean
        required: true
        default: false
  schedule:
    - cron: '7 5 * * *'
      timezone: 'Australia/Sydney'
    - cron: '37 5 * * *'
      timezone: 'Australia/Sydney'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-helpscout-calendar.yml'
      - 'src/helpscout-calendar.mjs'
      - 'scripts/sync-helpscout-calendar.mjs'

permissions:
  contents: read

concurrency:
  group: helpscout-sydney-dive-calendar
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      DRY_RUN: ${{ (github.event_name == 'schedule' || github.event_name == 'push' || inputs.publish) && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Read Beacon widgets and check or update the Help Scout article
        run: npm run sync:helpscout
        env:
          HELP_SCOUT_DOCS_API_KEY: ${{ secrets.HELP_SCOUT_DOCS_API_KEY }}
          HELP_SCOUT_ARTICLE_ID: ${{ secrets.HELP_SCOUT_ARTICLE_ID }}
      - name: Record verified Calendar publication
        if: success() && env.DRY_RUN == 'false'
        run: |
          git config user.name "abyss-future-dive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/helpscout-calendar-sync-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: record verified Calendar schedule refresh"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Save candidate and validation summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: helpscout-calendar-${{ github.run_number }}
          path: diagnostics/helpscout-calendar-*
          if-no-files-found: ignore
          retention-days: 14
