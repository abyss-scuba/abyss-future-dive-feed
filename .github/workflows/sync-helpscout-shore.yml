name: Shore Diving Help Scout snapshot

on:
  schedule:
    - cron: "0 4 * * *"
      timezone: "Australia/Sydney"
    - cron: "37 4 * * *"
      timezone: "Australia/Sydney"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the Shore Diving snapshot (unchecked = dry run)"
        type: boolean
        required: true
        default: false
  push:
    branches: [main]
    paths:
      - "src/helpscout-shore.mjs"
      - "scripts/sync-helpscout-shore.mjs"
      - ".github/workflows/sync-helpscout-shore.yml"
  pull_request:
    paths:
      - "src/helpscout-shore.mjs"
      - "scripts/sync-helpscout-shore.mjs"
      - "tests/helpscout-shore.test.mjs"
      - ".github/workflows/sync-helpscout-shore.yml"

permissions:
  contents: read

concurrency:
  group: helpscout-shore-diving-${{ github.event_name == 'pull_request' && github.run_id || 'publish' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
  refresh:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DRY_RUN: ${{ (github.event_name == 'schedule' || github.event_name == 'push' || inputs.publish) && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Scrape shore dates and verify Help Scout publication
        run: node scripts/sync-helpscout-shore.mjs
        env:
          HELP_SCOUT_DOCS_API_KEY: ${{ secrets.HELP_SCOUT_DOCS_API_KEY }}
      - name: Save validation result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: helpscout-shore-${{ github.run_number }}-${{ github.run_attempt }}
          path: diagnostics/helpscout-shore-*
          if-no-files-found: ignore
          retention-days: 14
      - name: Record the successful refresh
        if: success() && env.DRY_RUN == 'false'
        run: |
          git config user.name "abyss-future-dive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/helpscout-shore-sync-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: record verified shore schedule refresh"
          git pull --rebase origin main
          git push origin HEAD:main
