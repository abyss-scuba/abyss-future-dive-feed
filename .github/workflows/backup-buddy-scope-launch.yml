name: Back up fixed buddy and boat source state
on:
  push:
    branches: ['fix/beginner-launch-weekend-priority']
    paths: ['.github/workflows/backup-buddy-scope-launch.yml']
permissions: {contents: read}
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v6
        with: {node-version: '22'}
      - name: Read exact authorised sources without exporting plaintext
        env:
          HELP_SCOUT_DOCS_API_KEY: ${{ secrets.HELP_SCOUT_DOCS_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import {randomBytes,createCipheriv,publicEncrypt,constants,createHash} from 'node:crypto';
          const pub=`-----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA1dPjV/28Odj3v7wHa2lh
          Op/EYQYfDWXMEbvQvAemuud5EwhAi0a+kI+kGlj9Gu7xtrSn/btkLOua5/MZZxpw
          yw+AFa2TV30cx7L89TGJDXv9XgkS4gR9r2PgeUrlpJHbGCurL7HURyn0YENDPiv9
          KsFiPBNZuNJuVHFLWQBr/jpBITKwP67CJaEje31Veb+Dug0s4f9eg1lZg0XrP5nD
          N/LWbGsxVFqtFCAEUND0BmpjPQW76tQEP7UxgV9Ab+7CwJ1uOXS5Ez20+32cttNj
          O1pJhjBUy/VH7BW89P8U5hpJURualTXg4+vWYl3aIB+Kz2FWzXiu4I8qyLaYgyxj
          gwIDAQAB
          -----END PUBLIC KEY-----`;
          const targets=[['6abb767d3be702ed269e2eb4','6abb75219dcaab7ce64c5880'],['6ab992784b37f75b5ff65c3e','6ab98d4249f1bc2c6aefca54']];
          const hash=x=>createHash('sha256').update(x).digest('hex');
          try{
            const articles=[];
            for(const [id,cid] of targets)for(const draft of [false,true]){
              const r=await fetch('https://docsapi.helpscout.net/v1/articles/'+id+'?draft='+draft,{method:'GET',redirect:'error',signal:AbortSignal.timeout(20000),headers:{Authorization:'Basic '+Buffer.from(process.env.HELP_SCOUT_DOCS_API_KEY+':X').toString('base64'),Accept:'application/json'}});
              if(!r.ok)throw Error('Read status '+r.status);const a=(await r.json()).article;
              if(a.id!==id||a.collectionId!==cid||typeof a.text!=='string')throw Error('Identity mismatch');articles.push({requestedDraft:draft,article:a});
            }
            const key=randomBytes(32),iv=randomBytes(12),cipher=createCipheriv('aes-256-gcm',key,iv);
            const ciphertext=Buffer.concat([cipher.update(Buffer.from(JSON.stringify({checkedAt:new Date().toISOString(),articles}))),cipher.final()]);
            await fs.mkdir('source-backup',{recursive:true});
            await fs.writeFile('source-backup/private.encrypted.json',JSON.stringify({wrappedKey:publicEncrypt({key:pub,padding:constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},key).toString('base64'),iv:iv.toString('base64'),tag:cipher.getAuthTag().toString('base64'),ciphertext:ciphertext.toString('base64')}));
            const status=articles.map(({requestedDraft,article:a})=>({id:a.id,title:a.name,requestedDraft,hasDraft:!!a.hasDraft,status:a.status,hash:hash(a.text),characters:a.text.length}));
            await fs.writeFile('source-backup/status.json',JSON.stringify(status,null,2));console.log(JSON.stringify(status));
          }catch(e){console.error('Fixed source backup stopped: '+e.message);process.exitCode=1;}
          NODE
      - uses: actions/upload-artifact@v7
        with:
          name: beginner-launch-encrypted-source-backup
          path: source-backup/
          retention-days: 3
          if-no-files-found: error
